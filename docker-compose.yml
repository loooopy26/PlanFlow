services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       planflow
      POSTGRES_USER:     planflow
      POSTGRES_PASSWORD: planflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build: ./myBoard
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn board_project.wsgi:application --bind 0.0.0.0:8000"
    environment:
      POSTGRES_DB:       planflow
      POSTGRES_USER:     planflow
      POSTGRES_PASSWORD: planflow
      POSTGRES_HOST:     db
      POSTGRES_PORT:     5432
      DJANGO_SETTINGS_MODULE: board_project.settings
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy   # ← DB 완전히 뜬 다음에 Django 시작

  nginx:
    build: ./myNginx
    ports:
      - "80:80"
    volumes:
      - static_files:/usr/share/nginx/staticfiles:ro
    depends_on:
      - django

volumes:
  pg_data:
  static_files:
